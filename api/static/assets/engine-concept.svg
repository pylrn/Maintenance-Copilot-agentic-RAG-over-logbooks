<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" class="engine-concept-svg">
  <defs>
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a4365"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
    <linearGradient id="crank-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="50%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .hotspot { cursor: pointer; transition: all 0.2s ease; }
    .hotspot:hover { opacity: 0.85; filter: drop-shadow(0 0 4px #c25f38); }
    .hotspot.active { stroke: #c25f38 !important; stroke-width: 3px !important; }
    .comp-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #4a5568; pointer-events: none; }
  </style>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="#f8f6f1" rx="8"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#e2e8f0" stroke-width="1" rx="6" stroke-dasharray="4 4"/>

  <!-- Engine Title/Header -->
  <text x="30" y="38" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="18" fill="#081726">Generic Horizontally-Opposed Aircraft Engine (Conceptual 2D Schematic)</text>
  <text x="30" y="56" class="comp-label" fill="#718096">Illustrative model for component localization. Not certified for specific model overhaul.</text>

  <!-- Cooling Baffles & Shrouds -->
  <g id="node-cooling-baffles" class="hotspot" data-component-id="baffle_assembly">
    <g id="node-baffle" data-component-id="baffle_cooling">
      <path d="M 160 120 L 640 120 L 650 380 L 150 380 Z" fill="#edf2f7" stroke="#cbd5e0" stroke-width="2" stroke-dasharray="6 3"/>
      <text x="170" y="140" class="comp-label">Cooling Baffles &amp; Air Shrouds</text>
    </g>
  </g>

  <!-- Central Crankcase -->
  <g id="node-crankcase" class="hotspot" data-component-id="crankcase">
    <rect x="340" y="160" width="120" height="200" rx="8" fill="url(#crank-grad)" stroke="#1a202c" stroke-width="2"/>
    <circle cx="400" cy="200" r="16" fill="#e2e8f0" stroke="#718096" stroke-width="2"/>
    <circle cx="400" cy="260" r="16" fill="#e2e8f0" stroke="#718096" stroke-width="2"/>
    <circle cx="400" cy="320" r="16" fill="#e2e8f0" stroke="#718096" stroke-width="2"/>
    <text x="365" y="265" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff">CRANKCASE</text>
  </g>

  <!-- Oil System (Sump & Filter at bottom) -->
  <g id="node-oil-system" class="hotspot" data-component-id="oil_system">
    <path d="M 350 360 L 450 360 L 430 430 L 370 430 Z" fill="#744210" stroke="#553c9a" stroke-width="2"/>
    <rect x="440" y="380" width="45" height="30" rx="4" fill="#d69e2e" stroke="#744210" stroke-width="1.5"/>
    <text x="380" y="405" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff">OIL SUMP</text>
    <text x="445" y="425" class="comp-label" fill="#744210">Filter</text>
  </g>

  <!-- Left Bank Cylinders (Even: #2, #4, #6 or standard opposed layout) -->
  <g id="node-cylinder-bank" class="hotspot" data-component-id="cylinder_assembly">
    <!-- Cyl #2 (Top Left) -->
    <g id="cyl-2">
      <g id="node-cylinder" data-component-id="cylinder_assembly">
        <rect x="200" y="160" width="140" height="55" rx="4" fill="url(#metal-grad)" stroke="#081726" stroke-width="1.5"/>
        <!-- Fins -->
        <line x1="215" y1="160" x2="215" y2="215" stroke="#718096" stroke-width="1"/>
        <line x1="235" y1="160" x2="235" y2="215" stroke="#718096" stroke-width="1"/>
        <line x1="255" y1="160" x2="255" y2="215" stroke="#718096" stroke-width="1"/>
        <line x1="275" y1="160" x2="275" y2="215" stroke="#718096" stroke-width="1"/>
        <text x="210" y="195" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f7fafc">CYLINDER #2</text>
      </g>
    </g>

    <!-- Cyl #4 (Mid Left) -->
    <g id="cyl-4">
      <rect x="200" y="235" width="140" height="55" rx="4" fill="url(#metal-grad)" stroke="#081726" stroke-width="1.5"/>
      <line x1="215" y1="235" x2="215" y2="290" stroke="#718096" stroke-width="1"/>
      <line x1="235" y1="235" x2="235" y2="290" stroke="#718096" stroke-width="1"/>
      <line x1="255" y1="235" x2="255" y2="290" stroke="#718096" stroke-width="1"/>
      <text x="210" y="270" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f7fafc">CYLINDER #4</text>
    </g>

    <!-- Cyl #1 (Top Right) -->
    <g id="cyl-1">
      <rect x="460" y="160" width="140" height="55" rx="4" fill="url(#metal-grad)" stroke="#081726" stroke-width="1.5"/>
      <line x1="525" y1="160" x2="525" y2="215" stroke="#718096" stroke-width="1"/>
      <line x1="545" y1="160" x2="545" y2="215" stroke="#718096" stroke-width="1"/>
      <line x1="565" y1="160" x2="565" y2="215" stroke="#718096" stroke-width="1"/>
      <text x="510" y="195" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f7fafc">CYLINDER #1</text>
    </g>

    <!-- Cyl #3 (Mid Right) -->
    <g id="cyl-3">
      <rect x="460" y="235" width="140" height="55" rx="4" fill="url(#metal-grad)" stroke="#081726" stroke-width="1.5"/>
      <line x1="525" y1="235" x2="525" y2="290" stroke="#718096" stroke-width="1"/>
      <line x1="545" y1="235" x2="545" y2="290" stroke="#718096" stroke-width="1"/>
      <text x="510" y="270" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f7fafc">CYLINDER #3</text>
    </g>
  </g>

  <!-- Rocker Covers (Valve Covers on Cylinder Heads) -->
  <g id="node-rocker-cover" class="hotspot" data-component-id="rocker_cover">
    <g id="node-rocker" data-component-id="rocker_cover">
      <!-- Cyl 2 Rocker Cover -->
      <rect x="160" y="163" width="38" height="48" rx="6" fill="#c53030" stroke="#742a2a" stroke-width="2"/>
      <!-- Cyl 4 Rocker Cover -->
      <rect x="160" y="238" width="38" height="48" rx="6" fill="#c53030" stroke="#742a2a" stroke-width="2"/>
      <!-- Cyl 1 Rocker Cover -->
      <rect x="602" y="163" width="38" height="48" rx="6" fill="#c53030" stroke="#742a2a" stroke-width="2"/>
      <!-- Cyl 3 Rocker Cover -->
      <rect x="602" y="238" width="38" height="48" rx="6" fill="#c53030" stroke="#742a2a" stroke-width="2"/>
      <text x="100" y="150" class="comp-label" fill="#c53030">Rocker Covers &amp; Gaskets</text>
    </g>
  </g>

  <!-- Intake Pipes & Induction System -->
  <g id="node-intake-manifold" class="hotspot" data-component-id="intake_system">
    <g id="node-intake" data-component-id="intake_manifold">
      <!-- Runner lines from plenum -->
      <path d="M 400 370 Q 300 350 290 215" fill="none" stroke="#3182ce" stroke-width="6" stroke-linecap="round"/>
      <path d="M 400 370 Q 300 360 290 290" fill="none" stroke="#3182ce" stroke-width="6" stroke-linecap="round"/>
      <path d="M 400 370 Q 500 350 510 215" fill="none" stroke="#3182ce" stroke-width="6" stroke-linecap="round"/>
      <path d="M 400 370 Q 500 360 510 290" fill="none" stroke="#3182ce" stroke-width="6" stroke-linecap="round"/>
      <text x="320" y="465" class="comp-label" fill="#2b6cb0">Induction Plenum &amp; Manifold</text>
    </g>
  </g>

  <!-- Intake Pipe Individual Highlight -->
  <g id="node-intake-pipe" class="hotspot" data-component-id="intake_pipe">
    <path d="M 330 310 Q 295 270 290 215" fill="none" stroke="#63b3ed" stroke-width="4"/>
  </g>

  <!-- Intake Gaskets Flanges -->
  <g id="node-intake-gasket" class="hotspot" data-component-id="intake_gasket">
    <!-- Flange on Cyl #2 -->
    <ellipse cx="290" cy="215" rx="10" ry="5" fill="#dd6b20" stroke="#7b341e" stroke-width="2"/>
    <!-- Flange on Cyl #4 -->
    <ellipse cx="290" cy="290" rx="10" ry="5" fill="#dd6b20" stroke="#7b341e" stroke-width="2"/>
    <!-- Flange on Cyl #1 -->
    <ellipse cx="510" cy="215" rx="10" ry="5" fill="#dd6b20" stroke="#7b341e" stroke-width="2"/>
    <!-- Flange on Cyl #3 -->
    <ellipse cx="510" cy="290" rx="10" ry="5" fill="#dd6b20" stroke="#7b341e" stroke-width="2"/>
    <text x="210" y="145" class="comp-label" fill="#c05621">#2 Intake Gasket Flange</text>
    <line x1="285" y1="150" x2="290" y2="205" stroke="#dd6b20" stroke-width="1.5" stroke-dasharray="2 2"/>
  </g>

  <!-- Exhaust System -->
  <g id="node-exhaust-manifold" class="hotspot" data-component-id="exhaust_system">
    <g id="node-exhaust" data-component-id="exhaust_manifold">
      <path d="M 230 215 L 230 350 Q 230 370 200 390 L 180 430" fill="none" stroke="#e53e3e" stroke-width="5" stroke-linecap="round"/>
      <path d="M 570 215 L 570 350 Q 570 370 600 390 L 620 430" fill="none" stroke="#e53e3e" stroke-width="5" stroke-linecap="round"/>
      <text x="130" y="450" class="comp-label" fill="#e53e3e">Exhaust Riser / Manifold</text>
    </g>
  </g>

  <!-- Fuel Injector / Primer Lines -->
  <g id="node-fuel-injector" class="hotspot" data-component-id="fuel_system">
    <circle cx="260" cy="165" r="5" fill="#38a169" stroke="#22543d" stroke-width="1.5"/>
    <circle cx="260" cy="240" r="5" fill="#38a169" stroke="#22543d" stroke-width="1.5"/>
    <circle cx="540" cy="165" r="5" fill="#38a169" stroke="#22543d" stroke-width="1.5"/>
    <circle cx="540" cy="240" r="5" fill="#38a169" stroke="#22543d" stroke-width="1.5"/>
    <text x="280" y="110" class="comp-label" fill="#276749">Fuel Injector / Primer Nozzle</text>
    <line x1="290" y1="115" x2="265" y2="160" stroke="#38a169" stroke-width="1" stroke-dasharray="2 2"/>
  </g>
</svg>
