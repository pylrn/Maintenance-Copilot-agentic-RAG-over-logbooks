<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2b46" />
      <stop offset="100%" stop-color="#081726" />
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a5c6d" />
      <stop offset="50%" stop-color="#6c7f91" />
      <stop offset="100%" stop-color="#34485d" />
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c25f38" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#e07a52" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)" />

  <!-- Engine Block / Crankcase Center -->
  <rect x="250" y="160" width="300" height="180" rx="20" fill="url(#metal)" stroke="#8da3b6" stroke-width="2" />
  <text x="400" y="255" fill="#f8f6f1" font-family="'Archivo', sans-serif" font-weight="700" font-size="16" text-anchor="middle">CRANKCASE CORE</text>

  <!-- Cooling Baffles (Background deflector) -->
  <g id="node-baffle" data-component-id="baffle_cooling" style="cursor: pointer;">
    <path d="M 230,130 L 570,130 L 580,370 L 220,370 Z" fill="none" stroke="#5fb98a" stroke-width="3" stroke-dasharray="6,4" />
    <text x="400" y="115" fill="#5fb98a" font-family="'IBM Plex Mono', monospace" font-size="12" text-anchor="middle">COOLING BAFFLE PERIMETER</text>
  </g>

  <!-- Cylinders (Opposed Layout: Cyl 1 & 3 Left, Cyl 2 & 4 Right) -->
  <!-- Cylinder #1 -->
  <g id="node-cylinder-1" data-component-id="cylinder_assembly">
    <rect x="130" y="180" width="110" height="60" rx="6" fill="#24384d" stroke="#cfc7b6" stroke-width="2" />
    <line x1="145" y1="180" x2="145" y2="240" stroke="#6c7f91" stroke-width="2" />
    <line x1="160" y1="180" x2="160" y2="240" stroke="#6c7f91" stroke-width="2" />
    <line x1="175" y1="180" x2="175" y2="240" stroke="#6c7f91" stroke-width="2" />
    <line x1="190" y1="180" x2="190" y2="240" stroke="#6c7f91" stroke-width="2" />
    <line x1="205" y1="180" x2="205" y2="240" stroke="#6c7f91" stroke-width="2" />
    <text x="185" y="215" fill="#ffffff" font-family="'Archivo', sans-serif" font-size="12" font-weight="600" text-anchor="middle">CYL #1</text>
  </g>

  <!-- Cylinder #2 (Target Cylinder) -->
  <g id="node-cylinder" data-component-id="cylinder_assembly" style="cursor: pointer;">
    <rect x="560" y="180" width="110" height="60" rx="6" fill="#24384d" stroke="#c25f38" stroke-width="2.5" />
    <line x1="575" y1="180" x2="575" y2="240" stroke="#c25f38" stroke-width="2" />
    <line x1="590" y1="180" x2="590" y2="240" stroke="#c25f38" stroke-width="2" />
    <line x1="605" y1="180" x2="605" y2="240" stroke="#c25f38" stroke-width="2" />
    <line x1="620" y1="180" x2="620" y2="240" stroke="#c25f38" stroke-width="2" />
    <line x1="635" y1="180" x2="635" y2="240" stroke="#c25f38" stroke-width="2" />
    <text x="615" y="215" fill="#f8f6f1" font-family="'Archivo', sans-serif" font-size="12" font-weight="700" text-anchor="middle">CYL #2</text>
  </g>

  <!-- Rocker Cover #2 -->
  <g id="node-rocker" data-component-id="rocker_cover" style="cursor: pointer;">
    <rect x="675" y="183" width="26" height="54" rx="5" fill="#c25f38" stroke="#f8f6f1" stroke-width="1.5" />
    <text x="735" y="215" fill="#c25f38" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600">ROCKER BOX</text>
    <line x1="701" y1="210" x2="725" y2="210" stroke="#c25f38" stroke-width="1.5" />
  </g>

  <!-- Intake Manifold & Tubes -->
  <g id="node-intake" data-component-id="intake_manifold" style="cursor: pointer;">
    <!-- Intake Plenum Center -->
    <ellipse cx="400" cy="370" rx="45" ry="20" fill="#1b4263" stroke="#5fb98a" stroke-width="2" />
    <text x="400" y="375" fill="#f8f6f1" font-family="'IBM Plex Mono', monospace" font-size="11" text-anchor="middle">INDUCTION</text>
    <!-- Runner to Cyl #2 -->
    <path d="M 430,360 Q 560,350 580,245" fill="none" stroke="#e07a52" stroke-width="5" stroke-linecap="round" />
    <!-- Intake Flange / Gasket Node on Cyl 2 -->
    <circle cx="580" cy="245" r="7" fill="#f8f6f1" stroke="#c25f38" stroke-width="3" />
    <text x="595" y="265" fill="#f8f6f1" font-family="'Archivo', sans-serif" font-size="12" font-weight="700">INTAKE FLANGE &amp; GASKET</text>
  </g>

  <!-- Exhaust Manifold -->
  <g id="node-exhaust" data-component-id="exhaust_manifold" style="cursor: pointer;">
    <path d="M 580,175 Q 520,135 480,95" fill="none" stroke="#9aa7b2" stroke-width="4" stroke-linecap="round" />
    <text x="500" y="85" fill="#9aa7b2" font-family="'IBM Plex Mono', monospace" font-size="11">EXHAUST RISER</text>
  </g>

  <!-- Title & Legend -->
  <text x="35" y="45" fill="#f8f6f1" font-family="'Archivo', sans-serif" font-weight="800" font-size="16">AIRCRAFT RECIPROCATING ENGINE — SCHEMATIC OVERVIEW</text>
  <text x="35" y="68" fill="#c25f38" font-family="'IBM Plex Mono', monospace" font-size="12">EDUCATIONAL REFERENCE · APPLICABILITY: GENERIC OPPOSED 4-CYL</text>
</svg>
