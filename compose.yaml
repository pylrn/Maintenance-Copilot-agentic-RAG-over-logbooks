name: maintenance-atlas-p1
services:
  db:
    image: pgvector/pgvector:pg17@sha256:494dff7e67e7bc2c826b94c331364978d145ebb86fd338154138b084223b7f67
    environment:
      POSTGRES_USER: maintenance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: maintenance
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - maintenance_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintenance -d maintenance"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    profiles: [app]
    image: maintenance-atlas:p1
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://maintenance:${POSTGRES_PASSWORD}@db:5432/maintenance
      MODEL_CACHE_DIR: /app/models
      ARTIFACT_DIR: /app/artifacts
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./models:/app/models:ro
    depends_on:
      db:
        condition: service_healthy
volumes:
  maintenance_pg:
