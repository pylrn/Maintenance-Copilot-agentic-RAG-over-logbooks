[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maintenance-atlas"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
description = "Evidence-first maintenance retrieval platform"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.9,<3",
 "pydantic-settings>=2.5,<3", "asyncpg>=0.30,<1", "pgvector>=0.3,<1",
 "torch>=2.5,<3", "numpy>=1.26,<3", "rank-bm25>=0.2.2,<0.3", "httpx>=0.27,<1",
 "sentence-transformers>=5,<6", "pydantic-ai-slim[openai]>=1.106.0,<2",
 "python-multipart>=0.0.18", "pypdf>=5,<7", "itsdangerous>=2.2,<3"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.7,<1"]
[tool.setuptools.packages.find]
include = ["maintenance*", "api*", "scripts*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
